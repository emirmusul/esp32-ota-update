<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32 Sensor Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <h1>ESP32 Sensor Dashboard</h1>

    <div class="readings">
      <div class="reading">
        <span class="label">Temperature</span>
        <span class="value" id="temperature">--</span>
        <span class="unit">&deg;C</span>
      </div>
      <div class="reading">
        <span class="label">Humidity</span>
        <span class="value" id="humidity">--</span>
        <span class="unit">%</span>
      </div>
    </div>

    <p class="status" id="status">Waiting for JavaScript...</p>

    <section class="firmware">
      <span class="label">Firmware</span>

      <dl class="meta">
        <dt>Version</dt><dd id="fw-version">--</dd>
        <dt>Slot</dt><dd id="fw-slot">--</dd>
        <dt>State</dt><dd id="fw-state">--</dd>
        <dt>Built</dt><dd id="fw-built">--</dd>
      </dl>

      <button id="update-button" type="button">Check for update</button>
      <p class="status" id="ota-status"></p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
